name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Pages availability
        id: pages_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -s -o /tmp/pages-response.json -w "%{http_code}" \
            -u "x-access-token:${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages")

          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled for this repository; skipping deploy."
          else
            echo "Unexpected status while checking Pages site: $status"
            cat /tmp/pages-response.json
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        if: steps.pages_check.outputs.enabled == 'true'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        if: steps.pages_check.outputs.enabled == 'true'
        with:
          path: "docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        if: steps.pages_check.outputs.enabled == 'true'
